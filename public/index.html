<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orchard Field Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;min-height:100vh;background:#002244;max-width:480px;margin:0 auto;overflow-x:hidden;position:relative;}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:repeating-linear-gradient(45deg,transparent 0px,transparent 18px,rgba(105,190,40,0.3) 18px,rgba(105,190,40,0.3) 24px,transparent 24px,transparent 30px,rgba(255,255,255,0.12) 30px,rgba(255,255,255,0.12) 34px);pointer-events:none;z-index:0;}
.header{position:relative;z-index:10;background:#001428;padding:14px 18px 12px;border-bottom:2px solid #69BE28;display:flex;justify-content:space-between;align-items:center;}
.header-title h1{font-size:15px;font-weight:700;color:#fff;letter-spacing:0.5px}
.header-title p{font-size:11px;color:#69BE28;margin-top:3px}
.header-date .day{font-size:12px;font-weight:700;color:#69BE28;text-align:right}
.header-date .dt{font-size:10px;color:#4a8a28;text-align:right}
/* OFFLINE BANNER */
#offline-banner{display:none;position:relative;z-index:15;background:#ff4444;color:white;padding:7px 16px;font-size:11px;font-family:monospace;font-weight:700;text-align:center;letter-spacing:0.5px;}
#offline-banner.visible{display:block;}
.filters{position:relative;z-index:10;display:flex;gap:8px;padding:10px 16px;background:#001830;overflow-x:auto;}
.pill{flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid transparent;}
.pill.active{background:rgba(105,190,40,0.2);border-color:#69BE28;color:#69BE28}
.pill.inactive{background:rgba(0,0,0,0.3);border-color:rgba(105,190,40,0.2);color:#4a8a28}
.card-list{position:relative;z-index:5;padding:16px 0 100px;}
.card-wrap{position:relative;margin-bottom:22px;height:90px;cursor:pointer;transition:transform 0.15s;}
.card-wrap:active{transform:scale(0.98)}
.hex{position:absolute;height:84px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;}
.card-left .hex-green{left:20px;width:260px;top:14px;background:#69BE28}
.card-left .hex-navy{left:20px;width:260px;top:7px;background:#002f6c}
.card-left .hex-grey{left:20px;width:260px;top:0px;background:#c8d4e0}
.card-right .hex-green{right:20px;width:260px;top:14px;background:#69BE28}
.card-right .hex-navy{right:20px;width:260px;top:7px;background:#002f6c}
.card-right .hex-grey{right:20px;width:260px;top:0px;background:#c8d4e0}
.card-content{text-align:center;pointer-events:none;}
.card-name{font-size:14px;font-weight:900;font-family:Georgia,serif;color:#1a1a2e;display:flex;align-items:center;justify-content:center;gap:6px;}
.card-sub{font-size:9px;color:#334;font-family:monospace;margin-top:3px}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
/* LIVE TIMER */
#ov-live-timer{font-size:28px;font-weight:300;font-family:monospace;color:#69BE28;letter-spacing:3px;text-align:center;margin:10px 0 4px;display:none;}
#ov-timer-label{font-size:9px;color:#4a8a28;font-family:monospace;text-align:center;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;display:none;}
.spinner{width:24px;height:24px;border:2px solid rgba(105,190,40,0.2);border-top-color:#69BE28;border-radius:50%;animation:spin 0.75s linear infinite;margin:40px auto;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}}
@keyframes spin{to{transform:rotate(360deg)}}
.legend{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#001428;border-top:2px solid #69BE28;padding:10px 20px;display:flex;gap:16px;align-items:center;z-index:20;}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:#aaa}
.leg-dot{width:6px;height:6px;border-radius:50%}
</style>
</head>

<div style="position:fixed;bottom:52px;right:16px;z-index:30;display:flex;flex-direction:column;gap:10px;align-items:center">

<script>
// ═══════════════════════════════════════════════
// IMPROVEMENT 1: getLocalISOString
// Produces 2026-07-21T08:00:00 — local time, no UTC offset
// ═══════════════════════════════════════════════
function getLocalISOString(date) {
  var tzOffset = date.getTimezoneOffset() * 60000;
  return (new Date(date.getTime() - tzOffset)).toISOString().slice(0, 19);
}

// ═══════════════════════════════════════════════
// IMPROVEMENT 2: SESSION PERSISTENCE
// Write session start to localStorage immediately
// so Safari crashes dont lose start time
// ═══════════════════════════════════════════════
var SESSION_STORE_KEY = 'orchard_active_sessions';

function persistSessionStart(blockName, irrType) {
  var store = getSavedSessions();
  store[blockName] = { irrType: irrType, startedAt: getLocalISOString(new Date()), startMs: Date.now() };
  localStorage.setItem(SESSION_STORE_KEY, JSON.stringify(store));
}

function clearPersistedSession(blockName) {
  var store = getSavedSessions();
  delete store[blockName];
  localStorage.setItem(SESSION_STORE_KEY, JSON.stringify(store));
}

function getSavedSessions() {
  try { return JSON.parse(localStorage.getItem(SESSION_STORE_KEY) || '{}'); } catch(e) { return {}; }
}

function getPersistedSession(blockName) {
  return getSavedSessions()[blockName] || null;
}

// ═══════════════════════════════════════════════
// IMPROVEMENT 3: LIVE TIMER
// ═══════════════════════════════════════════════
var liveTimerInterval = null;

function startLiveTimer(startMs) {
  stopLiveTimer();
  var timerEl = document.getElementById('ov-live-timer');
  var labelEl = document.getElementById('ov-timer-label');
  if(timerEl) timerEl.style.display = 'block';
  if(labelEl) labelEl.style.display = 'block';
  function tick() {
    var diff = Math.floor((Date.now() - startMs) / 1000);
    var h = String(Math.floor(diff / 3600)).padStart(2,'0');
    var m = String(Math.floor((diff % 3600) / 60)).padStart(2,'0');
    var s = String(diff % 60).padStart(2,'0');
    if(timerEl) timerEl.textContent = h+':'+m+':'+s;
  }
  tick();
  liveTimerInterval = setInterval(tick, 1000);
}

function stopLiveTimer() {
  if(liveTimerInterval) { clearInterval(liveTimerInterval); liveTimerInterval = null; }
  var timerEl = document.getElementById('ov-live-timer');
  var labelEl = document.getElementById('ov-timer-label');
  if(timerEl) { timerEl.style.display = 'none'; timerEl.textContent = '00:00:00'; }
  if(labelEl) labelEl.style.display = 'none';
}

// ═══════════════════════════════════════════════
// IMPROVEMENT 4: OFFLINE BANNER
// ═══════════════════════════════════════════════

var retryQueue = [];
var RETRY_DELAYS = [30000, 60000, 120000, 300000, 900000];
var retryTimer = null;
function updateOnlineStatus() {
  var banner = document.getElementById('offline-banner');
  if(!banner) return;
  if(navigator.onLine) {
    banner.classList.remove('visible');
    flushRetryQueue();
  } else {
    banner.classList.add('visible');
  }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

function queueRetry(endpoint, body) {
  retryQueue.push({ endpoint: endpoint, body: body, attempt: 0, nextRetryAt: Date.now() + RETRY_DELAYS[0] });
  scheduleNextRetry();
}

function scheduleNextRetry() {
  if(retryTimer) return;
  var earliest = retryQueue.reduce(function(min, item) { return Math.min(min, item.nextRetryAt); }, Infinity);
  var delay = Math.max(0, earliest - Date.now());
  retryTimer = setTimeout(function() { retryTimer = null; flushRetryQueue(); }, delay);
}

function flushRetryQueue() {
  if(!navigator.onLine || !retryQueue.length) return;
  var now = Date.now();
  retryQueue.filter(function(item) { return item.nextRetryAt <= now; }).forEach(function(item) {
    fetch(item.endpoint, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(item.body) })
      .then(function(r) {
        if(r.ok) { retryQueue = retryQueue.filter(function(q) { return q !== item; }); }
        else { bumpRetry(item); }
      }).catch(function() { bumpRetry(item); });
  });
  if(retryQueue.length) scheduleNextRetry();
}

function bumpRetry(item) {
  item.attempt = Math.min(item.attempt + 1, RETRY_DELAYS.length - 1);
  item.nextRetryAt = Date.now() + RETRY_DELAYS[item.attempt];
}

// ═══════════════════════════════════════════════
// IMPROVEMENT 6: EDITABLE START TIME
// Worker can adjust start time if they forgot to open app on time
// ═══════════════════════════════════════════════
function showStartTimeModal(blockName, irrType) {
  var nowStr = getLocalISOString(new Date());
  var existing = document.getElementById('start-time-modal');
  if(existing) existing.remove();
  var modal = document.createElement('div');
  modal.id = 'start-time-modal';
  modal.style.cssText = 'position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:rgba(0,0,0,0.85);z-index:400;display:flex;align-items:center;justify-content:center;';
  modal.innerHTML = '<div style="background:#001428;border:1px solid #4466aa;border-radius:16px;padding:24px;width:90%">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">'
    +'<span style="color:white;font-size:15px;font-weight:700;font-family:Georgia,serif">'+irrType+'<br><span style="font-size:12px;font-weight:400;color:#69BE28">'+blockName+'</span></span>'
    +'<button onclick="document.getElementById(\'start-time-modal\').remove()" style="background:none;border:none;color:#aaa;font-size:20px;cursor:pointer">✕</button>'
    +'</div>'
    +'<div style="color:#69BE28;font-size:10px;font-family:monospace;text-transform:uppercase;margin-bottom:6px">Start Time</div>'
    +'<input id="start-time-input" type="datetime-local" value="'+nowStr+'" style="width:100%;background:#002244;border:1px solid rgba(105,190,40,0.3);border-radius:8px;padding:10px 12px;color:white;font-size:14px;outline:none;margin-bottom:8px">'
    +'<div style="color:#4a8a28;font-size:10px;font-family:monospace;margin-bottom:16px">Adjust if you started before opening the app</div>'
    +'<button onclick="confirmStart(\''+blockName.replace(/'/g,"\\'")+'\',' + '\''+irrType+'\')" style="background:#4466aa;color:white;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;width:100%">Start Session</button>'
    +'</div>';
  document.body.appendChild(modal);
}

function confirmStart(blockName, irrType) {
  var input = document.getElementById('start-time-input');
  var startTimeVal = input ? input.value : getLocalISOString(new Date());
  var modal = document.getElementById('start-time-modal');
  if(modal) modal.remove();
  persistSessionStart(blockName, irrType);
  var body = { block_name: blockName, session_type: 'Irrigation', irr_type: irrType, start_time: startTimeVal };
  fetch('/api/sessions/start', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.success){ closeOverlay(); loadBlocks(); }
      else { alert('Error: '+(data.message||'Unknown error')); clearPersistedSession(blockName); }
    })
    .catch(function(){
      queueRetry('/api/sessions/start', body);
      closeOverlay();
      loadBlocks();
    });
}

// ═══════════════════════════════════════════════
// LOGIN CHECK
// ═══════════════════════════════════════════════
var currentWorker = null;
var currentOperator = 'Jorge';
try {
  var savedWorker = localStorage.getItem('orchard_worker');
  if(!savedWorker){ window.location.href = '/login.html'; }
  else { currentWorker = JSON.parse(savedWorker); currentOperator = currentWorker.name; }
} catch(e){ window.location.href = '/login.html'; }

if(currentWorker){
  var el = document.getElementById('worker-name');
  if(el) el.textContent = currentWorker.name + ' · ' + currentWorker.role;

function formatDate(str){
  if(!str) return '—';
  try{
    var d = new Date(str);
    if(isNaN(d)) return str;
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/Los_Angeles'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'America/Los_Angeles'});
  }catch(e){return str;}
}

function getStatus(alert){ if((alert||'').includes('🛑')) return 'due'; if((alert||'').includes('🟡')) return 'soon'; return 'ok'; }
function getDotColor(status){ if(status==='due') return '#ff4444'; if(status==='soon') return '#ffcc00'; return '#69BE28'; }

function parseBlockInfo(s){
  var parts=(s||'').split(' . ');
  var ws=parts[2]||'';
  var dotIdx=ws.indexOf('.');
  return {location:(parts[0]||'—').trim(),irrType:(parts[1]||'—').trim(),waterSource:dotIdx>=0?ws.substring(0,dotIdx).trim():ws.trim(),variety:dotIdx>=0?ws.substring(dotIdx+1).trim():(parts[3]||'—').trim()};
}

function setFilter(filter,el){
  document.querySelectorAll('.pill').forEach(function(p){p.classList.remove('active');p.classList.add('inactive');});
  el.classList.add('active');el.classList.remove('inactive');
  if(filter==='all') renderCards(allBlocks);
  else renderCards(allBlocks.filter(function(b){return getStatus(b.alert)===filter;}));
}

function filterBlocks(query){
  var normalized=String(query||'').trim().toLowerCase();
  if(!normalized){renderCards(allBlocks);return;}
  renderCards(allBlocks.filter(function(b){
    return String(b.name||'').toLowerCase().includes(normalized)||String(b.location||'').toLowerCase().includes(normalized)||String(b.irrTypeMain||'').toLowerCase().includes(normalized)||String(b.variety||'').toLowerCase().includes(normalized);
  }));
}

function loadWeather(){
  fetch('/api/weather').then(r=>r.json()).then(function(data){
    if(data.success){
      document.getElementById('weather-temp').textContent=data.temp+'°';
      document.getElementById('weather-desc').textContent=data.humidity+'%';
      document.getElementById('weather-badge').title=data.description+' · Wind: '+data.wind+'mph · Feels: '+data.feels_like+'°';
      var lastTemp=parseInt(localStorage.getItem('last_alert_temp')||'0');
      if(data.temp>=90&&lastTemp<90){fetch('/api/weather/alert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({temp:data.temp,level:'critical'})});localStorage.setItem('last_alert_temp',String(data.temp));}
      else if(data.temp>=88&&lastTemp<88){fetch('/api/weather/alert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({temp:data.temp,level:'warning'})});localStorage.setItem('last_alert_temp',String(data.temp));}
      else if(data.temp<88){localStorage.setItem('last_alert_temp','0');}
      var alertEl=document.getElementById('temp-alert');
      if(alertEl){
        if(data.temp>=90){alertEl.style.display='flex';alertEl.style.background='rgba(255,68,68,0.9)';alertEl.style.color='#fff';alertEl.innerHTML='🚨 '+data.temp+'°F — Cooling system required! Start foggers immediately.';}
        else if(data.temp>=88){alertEl.style.display='flex';alertEl.style.background='rgba(255,204,0,0.9)';alertEl.style.color='#002244';alertEl.innerHTML='🌫️ '+data.temp+'°F — Foggers recommended. Monitor temperature.';}

      }
    }
  });
}

async function loadBlocks(){
  document.getElementById('card-list').innerHTML='<div class="spinner"></div>';
  try{
    var res=await fetch(GET_BLOCKS+'/api/blocks');
    var data=await res.json();
    allBlocks=data.blocks.map(function(block){
      var openId=String(block.open_session_id||'');
      return {name:String(block.name||'').trim(),alert:String(block.water_alert||'').trim(),lastWatered:formatDate(block.last_watered),rawLastWatered:String(block.last_watered||''),nextWater:formatDate(block.next_water),cycleDays:String(block.cycle_days||'6'),instructions:String(block.instructions||''),totalHours:parseFloat(block.total_hours)||0,openRecordId:openId,location:String(block.location||'—').trim(),irrTypeMain:String(block.irr_type||'—').trim(),waterSource:String(block.water_source||'—').trim(),variety:String(block.variety||'—').trim(),sessionStart:block.session_start||null};
    });
    allBlocks.sort(function(a,b){var sa=a.alert.includes('🛑')?0:a.alert.includes('🟡')?1:2;var sb=b.alert.includes('🛑')?0:b.alert.includes('🟡')?1:2;return sa-sb;});
    renderCards(allBlocks);
    window.dispatchEvent(new Event('blocksLoaded'));
  }catch(e){
    document.getElementById('card-list').innerHTML='<div style="color:#ff4444;text-align:center;padding:40px">Error loading blocks</div>';
  }
}

function renderCards(blocks){
  var list=document.getElementById('card-list');
  if(!blocks.length){list.innerHTML='<div style="color:#4a8a28;text-align:center;padding:40px">No blocks found</div>';return;}
  list.innerHTML=blocks.map(function(b,i){
    var status=getStatus(b.alert);
    var dot=getDotColor(status);
    var side=i%2===0?'card-left':'card-right';
    var savedSession=getPersistedSession(b.name);
    var hasActive=(b.openRecordId&&b.openRecordId!=='null'&&b.openRecordId.length>0)||savedSession;
    return '<div class="card-wrap '+side+'" data-idx="'+i+'" onclick="openBlock('+i+')">'
      +'<div class="hex hex-green"></div>'
      +'<div class="hex hex-navy"></div>'
      +'<div class="hex hex-grey">'
      +'<div class="card-content">'
      +'<div class="card-name">'+b.name+'<span class="sdot" style="background:'+dot+'"></span>'+(hasActive?'<span style="font-size:8px;color:#4466aa;animation:pulse 1.5s infinite">●</span>':'')+'</div>'
      +'<div class="card-sub">Last: '+b.lastWatered+'</div>'
      +'<div class="card-sub">Next: '+b.nextWater+'</div>'
      +'</div></div></div>';
  }).join('');
}

  var b=activeBlock;
  var dot=getDotColor(getStatus(b.alert));
  var hasSession=b.openRecordId&&b.openRecordId!=='null'&&b.openRecordId.length>0;

  document.getElementById('ov-name-fert').textContent=b.name;

  document.getElementById('ov-info-content').innerHTML='Last Watered: '+b.lastWatered+'<br>Next Water: '+b.nextWater+'<br>Type: '+b.irrTypeMain+'<br>Location: '+b.location+'<br>Water Source: '+b.waterSource+'<br>Variety: '+b.variety+'<br>Total Hours: '+b.totalHours+'h<br>Cycle: '+b.cycleDays+' days'+(b.instructions?'<br>Notes: '+b.instructions:'');

      '<div onclick="showStartTimeModal(\''+b.name.replace(/'/g,"\\'")+'\',' + '\'Drip\')" style="background:rgba(255,255,255,0.15);border:2px solid #4466aa;border-radius:12px;padding:14px;color:white;font-size:14px;font-weight:700;cursor:pointer;text-align:center">💧 Drip</div>'

function confirmEnd(blockName) {
  var input = document.getElementById('end-time-input');
  var endTimeVal = input ? input.value : getLocalISOString(new Date());
  var modal = document.getElementById('end-time-modal');
  if(modal) modal.remove();
  var body = { block_name: blockName, end_time: endTimeVal };
  fetch('/api/sessions/end', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.success){ clearPersistedSession(blockName); closeOverlay(); loadBlocks(); }
      else { alert('Error: '+(data.message||'Unknown error')); }
    })
    .catch(function(){
      queueRetry('/api/sessions/end', body);
      clearPersistedSession(blockName);
      closeOverlay();
    });
}

function logAction(type){
  if(!activeBlock) return;
  var block_name=activeBlock.name;
  var endpoint='';
  var body={block_name:block_name};
  if(type==='End Cycle'){
    showEndTimeModal(block_name);
    return;
  }
  else if(type==='Fertilizer'){endpoint='/api/sessions/fertilizer';}
  else if(type==='Foggers'){endpoint='/api/sessions/foggers';}
  if(!endpoint) return;
  fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.success){closeOverlay();loadBlocks();}
      else{alert('Error: '+(data.message||'Unknown error'));}
    })
    .catch(function(e){
      if(!navigator.onLine){queueRetry(endpoint,body);closeOverlay();}
      else{alert('Connection error: '+e.message);}
    });
}

    +'<select id="sh-block" onchange="toggleCustomBlock()" style="width:100%;background:#002244;border:1px solid rgba(105,190,40,0.3);border-radius:8px;padding:8px 12px;color:white;font-size:13px;outline:none"><option value="">-- Select Block --</option><option>Block 5</option><option>Block 6</option><option>Block 8</option><option>Block 9A</option><option>Block 9B</option><option>Block 9C</option><option>Block 10 Cherry</option><option>Block 10 Envy</option><option>Block 10 HC</option><option>Block 11</option><option>Block 12A</option><option>Block 12B</option><option>Block 12C</option><option>Block 12D</option><option>Block 20 Barts</option><option>Block 20 HC</option><option>Block 20 Young Barts</option><option>Block 20 Young Barts 2</option><option>Block 21</option><option>Block 22</option><option value="other">Other (type below)</option></select>'
    +'<input id="sh-block-custom" type="text" placeholder="Type block name..." style="display:none;width:100%;background:#002244;border:1px solid rgba(105,190,40,0.3);border-radius:8px;padding:8px 12px;color:white;font-size:13px;outline:none;margin-top:6px"></div>'
    +'<button onclick="submitClockIn()" style="background:#69BE28;color:#002244;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:4px">Clock In</button>'
    +'</div></div>';
  document.body.appendChild(modal);
}

function toggleCustomBlock(){var sel=document.getElementById('sh-block');var custom=document.getElementById('sh-block-custom');if(custom) custom.style.display=sel.value==='other'?'block':'none';}
function toggleCustomActivity(){var sel=document.getElementById('sh-activity');var custom=document.getElementById('sh-activity-custom');if(custom) custom.style.display=sel.value==='other'?'block':'none';}

function submitClockIn(){
  var actSel=document.getElementById('sh-activity').value;
  var actCustom=document.getElementById('sh-activity-custom').value;
  var activity=actSel==='other'?actCustom:actSel;
  var blkSel=document.getElementById('sh-block').value;
  var blkCustom=document.getElementById('sh-block-custom')?document.getElementById('sh-block-custom').value:'';
  var block=blkSel==='other'?blkCustom:blkSel;
  fetch('/api/shifts/clockin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operator:currentOperator,activity:activity,block_name:block})})
    .then(r=>r.json()).then(function(data){if(data.success){document.getElementById('shift-modal').remove();}else{alert('Error: '+data.message);}});
}

function clockOut(){
  if(!confirm('Clock out now?')) return;
  fetch('/api/shifts/clockout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operator:currentOperator})})
    .then(r=>r.json()).then(function(data){if(data.success){alert('Clocked out: '+data.hours+' hours logged');}else{alert('Error: '+data.message);}});
}

function switchActivity(){
  var modal=document.createElement('div');
  modal.id='shift-modal';
  modal.style.cssText='position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:rgba(0,0,0,0.85);z-index:300;display:flex;align-items:center;justify-content:center;';
  modal.innerHTML='<div style="background:#001428;border:1px solid #aaa;border-radius:16px;padding:24px;width:90%">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><span style="color:white;font-size:16px;font-weight:700">Switch Activity</span><button onclick="document.getElementById(\'shift-modal\').remove()" style="background:none;border:none;color:#aaa;font-size:20px;cursor:pointer">✕</button></div>'
    +'<div style="display:flex;flex-direction:column;gap:12px">'
    +'<div><div style="color:#aaa;font-size:10px;font-family:monospace;text-transform:uppercase;margin-bottom:4px">New Activity</div>'
    +'<select id="sw-activity" onchange="toggleCustomSwitch()" style="width:100%;background:#002244;border:1px solid rgba(150,150,150,0.3);border-radius:8px;padding:8px 12px;color:white;font-size:13px;outline:none"><option>Irrigation</option><option>Pruning</option><option>Thinning</option><option>Picking</option><option>General</option><option value="other">Other (type below)</option></select>'
    +'<input id="sw-activity-custom" type="text" placeholder="Type activity..." style="display:none;width:100%;background:#002244;border:1px solid rgba(150,150,150,0.3);border-radius:8px;padding:8px 12px;color:white;font-size:13px;outline:none;margin-top:6px"></div>'
    +'<div><div style="color:#aaa;font-size:10px;font-family:monospace;text-transform:uppercase;margin-bottom:4px">Block</div>'
    +'<select id="sw-block" onchange="toggleCustomSwitchBlock()" style="width:100%;background:#002244;border:1px solid rgba(150,150,150,0.3);border-radius:8px;padding:8px 12px;color:white;font-size:13px;outline:none"><option value="">-- Select Block --</option><option>Block 5</option><option>Block 6</option><option>Block 8</option><option>Block 9A</option><option>Block 9B</option><option>Block 9C</option><option>Block 10 Cherry</option><option>Block 10 Envy</option><option>Block 10 HC</option><option>Block 11</option><option>Block 12A</option><option>Block 12B</option><option>Block 12C</option><option>Block 12D</option><option>Block 20 Barts</option><option>Block 20 HC</option><option>Block 20 Young Barts</option><option>Block 20 Young Barts 2</option><option>Block 21</option><option>Block 22</option><option value="other">Other (type below)</option></select>'
    +'<input id="sw-block-custom" type="text" placeholder="Type block name..." style="display:none;width:100%;background:#002244;border:1px solid rgba(150,150,150,0.3);border-radius:8px;padding:8px 12px;color:white;font-size:13px;outline:none;margin-top:6px"></div>'
    +'<button onclick="submitSwitch()" style="background:#aaa;color:#002244;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:4px">Switch</button>'
    +'</div></div>';
  document.body.appendChild(modal);
}

function toggleCustomSwitch(){var sel=document.getElementById('sw-activity');var custom=document.getElementById('sw-activity-custom');if(custom) custom.style.display=sel.value==='other'?'block':'none';}
function toggleCustomSwitchBlock(){var sel=document.getElementById('sw-block');var custom=document.getElementById('sw-block-custom');if(custom) custom.style.display=sel.value==='other'?'block':'none';}

function submitSwitch(){
  var actSel=document.getElementById('sw-activity').value;
  var actCustom=document.getElementById('sw-activity-custom')?document.getElementById('sw-activity-custom').value:'';
  var activity=actSel==='other'?actCustom:actSel;
  var blkSel=document.getElementById('sw-block').value;
  var blkCustom=document.getElementById('sw-block-custom')?document.getElementById('sw-block-custom').value:'';
  var block=blkSel==='other'?blkCustom:blkSel;
  fetch('/api/shifts/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operator:currentOperator,activity:activity,block_name:block})})
    .then(r=>r.json()).then(function(data){if(data.success){document.getElementById('shift-modal').remove();alert('Switched to: '+activity);}else{alert('Error: '+data.message);}});
}

function loadWeeklyHours(){
  fetch('/api/shifts/weekly').then(r=>r.json()).then(function(data){if(data.success){var el=document.getElementById('weekly-used');if(el) el.textContent=data.total_hours+'h';}});
}

function showWeeklyHours(){
  fetch('/api/shifts/weekly').then(r=>r.json()).then(function(data){
    if(!data.success) return;
    var modal=document.createElement('div');
    modal.id='weekly-modal';
    modal.style.cssText='position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:rgba(0,0,0,0.85);z-index:300;display:flex;align-items:center;justify-content:center;';
    var pct=Math.min(100,(data.total_hours/39)*100).toFixed(0);
    var html='<div style="background:#001428;border:1px solid #c8d4e0;border-radius:16px;padding:24px;width:90%;max-height:80vh;overflow-y:auto">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><span style="color:white;font-size:16px;font-weight:700">Weekly Hours</span><button onclick="document.getElementById(\'weekly-modal\').remove()" style="background:none;border:none;color:#aaa;font-size:20px;cursor:pointer">X</button></div>'
      +'<div style="color:#aaa;font-size:11px;font-family:monospace;margin-bottom:12px">'+data.week_start+' -- '+data.week_end+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">'
      +'<div style="text-align:center;background:#002244;border-radius:10px;padding:12px"><div style="font-size:20px;font-weight:700;color:#69BE28">'+data.total_hours+'</div><div style="font-size:9px;color:#aaa;font-family:monospace">USED</div></div>'
      +'<div style="text-align:center;background:#002244;border-radius:10px;padding:12px"><div style="font-size:20px;font-weight:700;color:#ffcc00">39</div><div style="font-size:9px;color:#aaa;font-family:monospace">LIMIT</div></div>'
      +'<div style="text-align:center;background:#002244;border-radius:10px;padding:12px"><div style="font-size:20px;font-weight:700;color:'+(data.remaining<5?'#ff4444':'#c8d4e0')+'">'+data.remaining+'</div><div style="font-size:9px;color:#aaa;font-family:monospace">LEFT</div></div>'
      +'</div>'
      +'<div style="background:#002244;border-radius:8px;height:8px;margin-bottom:16px"><div style="background:#69BE28;height:8px;border-radius:8px;width:'+pct+'%"></div></div>';
    if(data.entries.length){
      html+='<div style="color:#69BE28;font-size:10px;font-family:monospace;text-transform:uppercase;margin-bottom:8px">Entries</div>';
      data.entries.forEach(function(e){
        var eStr=JSON.stringify(e).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        html+='<div style="background:#002244;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer" onclick="showEntryDetail('+eStr+')">'
          +'<div style="display:flex;justify-content:space-between"><span style="color:white;font-size:13px;font-weight:700">'+e.weekday+'</span><span style="color:#69BE28;font-size:12px;font-weight:700">'+e.day_hours+'h</span></div>'
          +'<div style="color:#aaa;font-size:10px;margin-top:4px">'+e.date+'</div></div>';
      });
    }else{html+='<div style="color:#4a8a28;text-align:center;padding:20px">No entries this week</div>';}
    html+='</div>';
    modal.innerHTML=html;
    document.body.appendChild(modal);
  });
}

function showEntryDetail(entry){
  var detail=document.createElement('div');
  detail.style.cssText='position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:rgba(0,0,0,0.92);z-index:400;display:flex;align-items:center;justify-content:center;';
  var fT=function(s){if(!s)return '--';var d=new Date(s);return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'America/Los_Angeles'});};
  var html='<div style="background:#001428;border:1px solid #69BE28;border-radius:16px;padding:24px;width:90%;max-height:80vh;overflow-y:auto">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><span style="color:white;font-size:15px;font-weight:700">'+entry.weekday+' - '+entry.date+'</span><button onclick="this.parentElement.parentElement.parentElement.remove()" style="background:none;border:none;color:#aaa;font-size:20px;cursor:pointer">X</button></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">'
    +'<div style="background:#002244;border-radius:8px;padding:10px"><div style="color:#69BE28;font-size:9px;font-family:monospace">START</div><div style="color:white;font-size:13px;font-weight:700">'+fT(entry.first_in)+'</div></div>'
    +'<div style="background:#002244;border-radius:8px;padding:10px"><div style="color:#69BE28;font-size:9px;font-family:monospace">END</div><div style="color:white;font-size:13px;font-weight:700">'+fT(entry.last_out)+'</div></div>'
    +'<div style="background:#002244;border-radius:8px;padding:10px"><div style="color:#69BE28;font-size:9px;font-family:monospace">TOTAL HOURS</div><div style="color:white;font-size:13px;font-weight:700">'+entry.day_hours+'h</div></div>'
    +'<div style="background:#002244;border-radius:8px;padding:10px"><div style="color:#69BE28;font-size:9px;font-family:monospace">ENTRIES</div><div style="color:white;font-size:13px;font-weight:700">'+entry.shifts.length+'</div></div>'
    +'</div>';
  if(entry.breaks.length){
    html+='<div style="color:#ffcc00;font-size:10px;font-family:monospace;text-transform:uppercase;margin-bottom:8px">Breaks</div>';
    entry.breaks.forEach(function(b){html+='<div style="background:#002244;border-radius:8px;padding:8px 12px;margin-bottom:6px;display:flex;justify-content:space-between"><span style="color:#aaa;font-size:12px">'+b.time+'</span><span style="color:#ffcc00;font-size:12px;font-weight:700">'+b.duration+'</span></div>';});
  }
  if(entry.shifts.length){
    html+='<div style="color:#69BE28;font-size:10px;font-family:monospace;text-transform:uppercase;margin:12px 0 8px">Activities</div>';
    entry.shifts.forEach(function(s){
      html+='<div style="background:#002244;border-radius:8px;padding:10px;margin-bottom:6px">'
        +'<div style="display:flex;justify-content:space-between"><span style="color:white;font-size:12px;font-weight:700">'+s.activity+'</span><span style="color:#69BE28;font-size:11px">'+(parseFloat(s.total_hours)||0).toFixed(2)+'h</span></div>'
        +'<div style="color:#aaa;font-size:10px;margin-top:3px">'+(s.block_name||'--')+' - '+(s.location||'--')+'</div>'
        +'<div style="color:#555;font-size:10px;margin-top:2px">'+fT(s.clock_in)+' to '+fT(s.clock_out)+'</div></div>';
    });
  }
  html+='</div>';
  detail.innerHTML=html;
  document.body.appendChild(detail);
}

function showSwitchType(){
  if(!activeBlock) return;
  var modal=document.createElement('div');
  modal.id='switch-type-modal';
  modal.style.cssText='position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:rgba(0,0,0,0.85);z-index:300;display:flex;align-items:center;justify-content:center;';
  modal.innerHTML='<div style="background:#001428;border:1px solid #4466aa;border-radius:16px;padding:24px;width:90%">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><span style="color:white;font-size:16px;font-weight:700">🔄 Switch Irrigation Type</span><button onclick="document.getElementById(\'switch-type-modal\').remove()" style="background:none;border:none;color:#aaa;font-size:20px;cursor:pointer">✕</button></div>'
    +'<div style="color:#aaa;font-size:12px;margin-bottom:16px">Block: '+activeBlock.name+'</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px">'
    +'<div onclick="submitSwitchType(\'Sprinkler r10\')" style="background:rgba(255,255,255,0.1);border:2px solid #4466aa;border-radius:12px;padding:16px;color:white;font-size:15px;font-weight:700;cursor:pointer;text-align:center">💦 Sprinkler r10</div>'
    +'<div onclick="submitSwitchType(\'Drip\')" style="background:rgba(255,255,255,0.1);border:2px solid #4466aa;border-radius:12px;padding:16px;color:white;font-size:15px;font-weight:700;cursor:pointer;text-align:center">💧 Drip</div>'
    +'</div></div>';
  document.body.appendChild(modal);
}

function submitSwitchType(irrType){
  if(!activeBlock) return;
  fetch('/api/sessions/switch-type',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({block_name:activeBlock.name,irr_type:irrType})})
    .then(r=>r.json()).then(function(data){if(data.success){document.getElementById('switch-type-modal').remove();closeOverlay();loadBlocks();}else{alert('Error: '+data.message);}});
}

loadWeeklyHours();
loadBlocks();
</script>
</body>
</html>
