<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#002244">
<title>Orchard Field — Login</title>
<style>
  :root{--navy-950:#001428;--navy-900:#002244;--surface:#061e34;--green:#69be28;--green-soft:#b1dc82;--text:#f4f7f2;--muted:#aab8c2}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{-webkit-user-select:none;user-select:none;
    font-family:Arial,sans-serif;
    background:radial-gradient(ellipse at 50% 25%,#123c46 0,#002244 65%);
    min-height:100vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  body::before{
    content:'';position:fixed;top:0;left:0;width:100%;height:100%;
    background:radial-gradient(circle at 50% 15%,rgba(105,190,40,.08),transparent 52%);
    pointer-events:none;z-index:0;
  }
  .container{
    position:relative;z-index:1;
    width:90%;max-width:360px;
    text-align:center;
  }
  .logo{
    font-family:Georgia,serif;
    font-size:28px;font-weight:700;
    color:#ffffff;margin-bottom:6px;
  }
  .logo span{color:#69BE28}
  .subtitle{
    font-size:13px;color:#b1dc82;
    font-family:monospace;letter-spacing:2px;
    text-transform:uppercase;margin-bottom:40px;
  }
  .pin-card{
    background:rgba(6,30,52,.96);
    border:1px solid rgba(177,220,130,.24);
    border-radius:20px;padding:32px 24px;
    box-shadow:0 24px 64px rgba(0,0,0,.28);
  }
  .pin-label{
    font-size:13px;color:#b1dc82;
    font-family:monospace;text-transform:uppercase;
    letter-spacing:2px;margin-bottom:20px;
  }
  .pin-display{
    display:flex;gap:12px;justify-content:center;
    margin-bottom:28px;
  }
  .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .pin-dot{
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(105,190,40,0.4);
    background:transparent;
    transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease;
  }
  .pin-dot.filled{
    background:#69BE28;
    border-color:#69BE28;
    box-shadow:0 0 8px rgba(105,190,40,0.5);
  }
  .pin-grid{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    gap:12px;
  }
  .pin-btn{
    appearance:none;width:100%;min-height:64px;
    background:rgba(0,34,68,.8);
    border:1px solid rgba(177,220,130,.2);
    border-radius:14px;padding:18px;
    font-size:20px;font-weight:700;color:#ffffff;
    font-family:inherit;
    cursor:pointer;
    transition:background-color .15s ease,border-color .15s ease,transform .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .pin-btn:active{
    background:rgba(105,190,40,0.2);
    border-color:#69BE28;
    transform:scale(0.95);
  }
  .pin-btn.del{color:#ff4444;font-size:16px}
  .pin-btn.empty{background:transparent;border:none;cursor:default;visibility:hidden}
  .pin-btn:focus-visible{outline:3px solid #b1dc82;outline-offset:3px}
  .error-msg{
    color:#ff7770;font-size:14px;
    font-family:monospace;margin-top:16px;
    min-height:20px;
  }
  .greeting{
    display:none;
    flex-direction:column;align-items:center;
    padding:20px 0;
  }
  .greeting-name{
    font-family:Georgia,serif;
    font-size:28px;font-weight:700;color:#ffffff;
    margin-bottom:8px;
  }
  .greeting-sub{font-size:13px;color:#69BE28;margin-bottom:24px}
  .spinner{width:24px;height:24px;border:2px solid rgba(105,190,40,0.2);border-top-color:#69BE28;border-radius:50%;animation:spin 0.75s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-height:650px){body{justify-content:flex-start;padding:24px 0}.subtitle{margin-bottom:20px}.pin-card{padding:22px 20px}.pin-display{margin-bottom:18px}.pin-grid{gap:8px}.pin-btn{min-height:54px;padding:12px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="container">
  <div class="logo">🌿 Orchard<span>Field</span></div>
  <div class="subtitle">McDougall Family Farming</div>

  <div class="pin-card">
    <div id="pin-section">
      <div class="pin-label">Enter Your PIN</div>
      <div class="pin-display" aria-hidden="true">
        <div class="pin-dot" id="d1" aria-hidden="true"></div>
        <div class="pin-dot" id="d2" aria-hidden="true"></div>
        <div class="pin-dot" id="d3" aria-hidden="true"></div>
        <div class="pin-dot" id="d4" aria-hidden="true"></div>
      </div>
      <div class="visually-hidden" id="pin-status" role="status" aria-live="polite">0 of 4 digits entered</div>
      <div class="pin-grid">
        <button type="button" class="pin-btn" aria-label="Enter 1" onclick="addPin('1')">1</button>
        <button type="button" class="pin-btn" aria-label="Enter 2" onclick="addPin('2')">2</button>
        <button type="button" class="pin-btn" aria-label="Enter 3" onclick="addPin('3')">3</button>
        <button type="button" class="pin-btn" aria-label="Enter 4" onclick="addPin('4')">4</button>
        <button type="button" class="pin-btn" aria-label="Enter 5" onclick="addPin('5')">5</button>
        <button type="button" class="pin-btn" aria-label="Enter 6" onclick="addPin('6')">6</button>
        <button type="button" class="pin-btn" aria-label="Enter 7" onclick="addPin('7')">7</button>
        <button type="button" class="pin-btn" aria-label="Enter 8" onclick="addPin('8')">8</button>
        <button type="button" class="pin-btn" aria-label="Enter 9" onclick="addPin('9')">9</button>
        <span class="pin-btn empty" aria-hidden="true"></span>
        <button type="button" class="pin-btn" aria-label="Enter 0" onclick="addPin('0')">0</button>
        <button type="button" class="pin-btn del" aria-label="Delete last digit" onclick="delPin()">⌫</button>
      </div>
      <div class="error-msg" id="error-msg" role="status" aria-live="polite"></div>
    </div>

    <div class="greeting" id="greeting-section">
      <div class="spinner" id="greeting-spinner"></div>
      <div class="greeting-name" id="greeting-name"></div>
      <div class="greeting-sub" id="greeting-sub"></div>
    </div>
  </div>
</div>

<script>
var pin = '';

// Check if already logged in — a worker WITHOUT a token means a stale session
// from before token auth existed (or an old logout that missed clearing it);
// without a token every write silently fails with "Not authenticated", so
// require both before skipping straight into the app.
var saved = localStorage.getItem('orchard_worker');
var savedToken = localStorage.getItem('orchard_token');
if(saved && savedToken){
  try{
    var w = JSON.parse(saved);
    window.location.href = '/index.html';
  }catch(e){
    localStorage.removeItem('orchard_worker');
    localStorage.removeItem('orchard_token');
  }
} else if(saved && !savedToken){
  localStorage.removeItem('orchard_worker');
}

function addPin(digit){
  if(pin.length >= 4) return;
  pin += digit;
  updateDots();
  if(pin.length === 4) submitPin();
}

function delPin(){
  pin = pin.slice(0,-1);
  updateDots();
  document.getElementById('error-msg').textContent = '';
}

function updateDots(){
  for(var i=1;i<=4;i++){
    var dot = document.getElementById('d'+i);
    if(i <= pin.length) dot.classList.add('filled');
    else dot.classList.remove('filled');
  }
  document.getElementById('pin-status').textContent = pin.length+' of 4 digits entered';
}

function submitPin(){
  document.getElementById('pin-section').style.display = 'none';
  document.getElementById('greeting-section').style.display = 'flex';

  fetch('/api/workers/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin:pin})
  }).then(r=>r.json()).then(function(data){
    if(data.success){
      var w = data.worker;
      localStorage.setItem('orchard_worker', JSON.stringify(w));
      if(data.token) localStorage.setItem('orchard_token', data.token);

      var hour = new Date().getHours();
      var timeGreet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

      document.getElementById('greeting-spinner').style.display = 'none';
      if(w.role === 'Boss'){
        document.getElementById('greeting-name').textContent = 'Welcome';
        document.getElementById('greeting-sub').textContent = timeGreet;
      } else {
        document.getElementById('greeting-name').textContent = w.greeting+', '+w.name+'!';
        document.getElementById('greeting-sub').textContent = timeGreet+' · '+w.role;
      }
      setTimeout(function(){
        window.location.href = w.role === 'Boss' ? '/admin.html' : '/index.html';
      }, 1800);
    } else {
      document.getElementById('greeting-section').style.display = 'none';
      document.getElementById('pin-section').style.display = 'block';
      document.getElementById('error-msg').textContent = 'Invalid PIN — try again';
      pin = '';
      updateDots();
    }
  }).catch(function(){
    document.getElementById('greeting-section').style.display = 'none';
    document.getElementById('pin-section').style.display = 'block';
    document.getElementById('error-msg').textContent = 'Connection error — try again';
    pin = '';
    updateDots();
  });
}

document.addEventListener('keydown',function(event){
  if(document.getElementById('pin-section').style.display === 'none') return;
  if(/^\d$/.test(event.key)) addPin(event.key);
  else if(event.key === 'Backspace') delPin();
});
</script>
</body>
</html>
